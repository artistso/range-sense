name: Android CI

on:
  push:
    branches: [main, "build/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify toolchain
        shell: bash
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run core tests and coverage
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :game-core:test :game-core:jacocoTestReport 2>&1 | tee build/ci/core-tests.log

      - name: Run Android lint
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:lintDebug 2>&1 | tee build/ci/android-lint.log

      - name: Build debug APK
        shell: bash
        run: |
          mkdir -p build/ci
          set -o pipefail
          gradle --no-daemon --console=plain --stacktrace :app:assembleDebug 2>&1 | tee build/ci/android-build.log

      - name: Generate assurance evidence bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci/evidence
          git rev-parse HEAD > build/ci/evidence/commit-sha.txt
          git status --porcelain=v1 > build/ci/evidence/git-status.txt
          if [[ -s build/ci/evidence/git-status.txt ]]; then
            echo "Build modified tracked source files:" >&2
            cat build/ci/evidence/git-status.txt >&2
            exit 1
          fi
          find app/src game-core/src -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > build/ci/evidence/source-sha256.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > build/ci/evidence/apk-sha256.txt
          gradle --no-daemon --console=plain :app:dependencies :game-core:dependencies \
            > build/ci/evidence/dependency-report.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: range-sense-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload assurance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: range-sense-assurance-evidence
          path: build/ci/evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: range-sense-ci-diagnostics
          path: build/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test, coverage, and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: range-sense-verification-reports
          path: |
            game-core/build/reports/tests/
            game-core/build/reports/jacoco/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: warn
          retention-days: 30
